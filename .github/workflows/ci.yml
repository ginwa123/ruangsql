name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    # GitHub-hosted runners only — no self-hosted labels.
    # NOTE: no `services:` here — container services only run on Linux
    # runners ("Container operations are only supported on Linux
    # runners"). Postgres-backed coverage lives in the `test-postgres`
    # job below (ubuntu-only). Without a server, the postgres tests
    # self-skip via test_helpers.getOrStartTestInstance.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Windows: stock vcpkg sqlite3 lacks the fts5 module, so force
        # the vendored amalgamation (libpq/openssl still come from
        # vcpkg). Other OSes link their system sqlite3.
        include:
          - os: ubuntu-latest
            sqlite_vendor: ""
          - os: macos-latest
            sqlite_vendor: ""
          - os: windows-latest
            sqlite_vendor: "-Dsqlite-vendor=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libssl-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite libpq openssl@3

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install sqlite3:x64-windows libpq:x64-windows openssl:x64-windows

      # Windows: the test binary links vcpkg import .libs (sqlite3.lib,
      # libpq.lib, …) and needs the matching DLLs at RUNTIME. Without
      # vcpkg/bin on PATH the loader picks a stale system sqlite3.dll
      # (or none) and every sqlite test segfaults. Same requirement as
      # the main repo's prependVcpkgBinToPath build helper.
      - name: Add vcpkg DLLs to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\vcpkg\installed\x64-windows\bin" | Out-File -Append $env:GITHUB_PATH

      # Idempotent safety net: hosts without system libs fall back to
      # the vendored amalgamation, which must exist at build time.
      # Skips automatically when vendor/sqlite3/ is already populated.
      - name: Fetch vendored sqlite3 (fallback for hosts without system libs)
        shell: bash
        run: bash scripts/fetch-vendor-sqlite3.sh

      - name: Test (sqlite-only, system libs)
        run: zig build test ${{ matrix.sqlite_vendor }}

      - name: Test (sqlite + postgres)
        # Quoted: PowerShell parses a bare comma as an array operator
        # ("Missing argument in parameter list"); quotes are harmless
        # on bash too.
        run: zig build test "-Ddb_used=sqlite,postgres" ${{ matrix.sqlite_vendor }}

      - name: Test (vendored amalgamation path)
        run: zig build test -Dforce-vendor=true

  test-postgres:
    # Real postgres coverage on ubuntu-latest (the only runner family
    # that supports container services). The `test` job above covers
    # the build matrix; this job proves the postgres backend against
    # a live server.
    name: test-postgres (ubuntu-latest + pg16 service)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libssl-dev postgresql-client

      - name: Fetch vendored sqlite3 (fallback for hosts without system libs)
        shell: bash
        run: bash scripts/fetch-vendor-sqlite3.sh

      # Point the suite at the service container above. Without this,
      # getOrStartTestInstance probes the default local socket
      # (host=/tmp port=54329 user=ginwa) and the postgres tests
      # self-skip with no assertions.
      - name: Test (sqlite + postgres, live server)
        run: zig build test "-Ddb_used=sqlite,postgres"
        env:
          POSTGRES_TEST_CONNINFO: "host=localhost port=5432 user=postgres password=postgres dbname=postgres connect_timeout=10"
